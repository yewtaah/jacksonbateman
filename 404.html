<!--
  404.html — not-found page.

  Heads up: this page is not currently reachable. The Amplify app's rewrite
  rules (Hosting > Rewrites and redirects in the AWS console — this isn't
  config committed to the repo) include a catch-all "/<*> -> /index.html,
  404-200" rule, which is the standard Amplify default for single-page
  apps. That rule matches first and sends every not-found URL to the
  homepage (with the HTTP status forced to 404) instead of to this file.
  See the "wire up the real 404 page" issue in GitHub Issues.
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page Not Found — Jackson Bateman</title>
<link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg" />
<link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>
<div class="not-found">
  <p class="huge">404</p>
  <h1 style="margin-top:0.3em">This page isn't on file.</h1>
  <p class="lede" style="max-width:40ch">The page you're looking for doesn't exist. Let's get you back on track.</p>
  <a href="/index.html" class="btn btn-primary mt-40">Back to Home</a>
</div>
</body>
</html>
